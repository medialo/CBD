<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Vente flash (page de test)</title>
    <style>
      body { font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f4f8; }
      .card { padding: 32px 48px; border-radius: 12px; background: #fff; box-shadow: 0 4px 24px rgb(0 0 0 / .08); text-align: center; }
      #counter { font: 700 48px ui-monospace, monospace; }
      #promo-btn { margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 8px; background: #e11d48; color: #fff; font-size: 18px; cursor: pointer; }
      #result { margin-top: 16px; color: #16a34a; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <p>La vente flash commence dans</p>
      <div id="counter">00:10</div>
      <div id="slot"></div>
      <div id="result"></div>
      <p><small>Le bouton n’existe pas avant la fin du chrono. Paramètre <code>?s=</code> pour changer la durée.</small></p>
    </div>
    <script>
      let remaining = Number(new URLSearchParams(location.search).get('s') ?? 10)
      const counter = document.getElementById('counter')
      const format = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
      counter.textContent = format(remaining)
      const timer = setInterval(() => {
        remaining -= 1
        counter.textContent = format(remaining)
        if (remaining > 0) return
        clearInterval(timer)
        // Le bouton arrive avec un léger retard et désactivé, comme sur un vrai site.
        setTimeout(() => {
          const button = document.createElement('button')
          button.id = 'promo-btn'
          button.className = 'btn-' + Math.random().toString(36).slice(2, 8)
          button.textContent = 'Profiter de la promo'
          button.disabled = true
          button.addEventListener('click', () => {
            document.getElementById('result').textContent = `Promo activée à ${new Date().toLocaleTimeString('fr-FR')} ✓`
          })
          document.getElementById('slot').append(button)
          setTimeout(() => (button.disabled = false), 500)
        }, 300)
      }, 1000)
    </script>
  </body>
</html>
